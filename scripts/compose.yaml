name: semiplot-bench

services:
  semiplot-bench:
    container_name: semiplot-bench
    image: semiplot-bench:manual
    build:
      context: ../SemiPlot/SemiPlot.Tests.Data/bench
    ports:
      - "55432:5432"
    environment:
      POSTGRES_PASSWORD: semibase-container-superuser
      SEMIBASE_WRITER_PASSWORD: semibase-container-writer
      SEMIBASE_READER_PASSWORD: semibase-container-reader
      SEMIPLOT_PROVISIONED_DATABASE: semiplot_provisioned
    volumes:
      - semiplot-bench-data:/var/lib/postgresql/data

volumes:
  semiplot-bench-data:
