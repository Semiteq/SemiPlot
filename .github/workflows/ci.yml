name: ci

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/ci.yml"
      - ".editorconfig"
      - "SemiPlot/**"
      - "SemiPlot.slnx"
      - "global.json"
      - "!**.md"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".editorconfig"
      - "SemiPlot/**"
      - "SemiPlot.slnx"
      - "global.json"
      - "!**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: restore
        run: dotnet restore SemiPlot.slnx

      - name: build
        run: dotnet build SemiPlot.slnx -c Release --no-restore

      - name: test
        run: dotnet test SemiPlot/SemiPlot.Tests/SemiPlot.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"
