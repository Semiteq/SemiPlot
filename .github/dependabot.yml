version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      "GitHub Actions updates":
        patterns:
          - "*"

  - package-ecosystem: "nuget"
    directory: "/SemiPlot"
    schedule:
      interval: "monthly"
    groups:
      "NuGet updates":
        patterns:
          - "*"
