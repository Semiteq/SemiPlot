name: ci

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/ci.yml"
      - ".editorconfig"
      - "SemiPlot/**"
      - "SemiPlot.slnx"
      - "global.json"
      - "!**.md"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".editorconfig"
      - "SemiPlot/**"
      - "SemiPlot.slnx"
      - "global.json"
      - "!**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The unit suite on the platform the viewer ships on. The Windows runner cannot host a Linux
  # container, so the gated projects run on the Linux job alone.
  unit-windows:
    name: Unit (Windows)
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: restore
        run: dotnet restore SemiPlot.slnx

      - name: build
        run: dotnet build SemiPlot.slnx -c Release --no-restore

      - name: test
        run: dotnet test SemiPlot/SemiPlot.Tests/SemiPlot.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

  # One build of the solution, then every test project. The container fixture builds the bench
  # image from SemiPlot/SemiPlot.Tests.Data/bench over ghcr.io/semiteq/semibase:latest, a public
  # package the runner pulls with no login; the Docker daemon ubuntu-latest carries is all it needs.
  # The headless Avalonia stack relies on the runner image providing libfontconfig.so.1, which
  # libSkiaSharp.so links against. When it is absent, `ldd libSkiaSharp.so` reports
  # `libfontconfig.so.1 => not found` and every test that constructs TrendChartViewModel fails at
  # once, not only the one that rasterises. The remedy is `sudo apt-get install -y libfontconfig1`
  # ahead of the test steps.
  linux:
    name: Unit, data and journeys (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: restore
        run: dotnet restore SemiPlot.slnx

      - name: build
        run: dotnet build SemiPlot.slnx -c Release --no-restore

      - name: unit tests
        run: dotnet test SemiPlot/SemiPlot.Tests/SemiPlot.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      - name: data tests
        run: dotnet test SemiPlot/SemiPlot.Tests.Data/SemiPlot.Tests.Data.csproj -c Release --no-build --logger "console;verbosity=normal"

      - name: journey tests
        run: dotnet test SemiPlot/SemiPlot.Tests.Journeys/SemiPlot.Tests.Journeys.csproj -c Release --no-build --logger "console;verbosity=normal"
