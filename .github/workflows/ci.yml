name: ci

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/ci.yml"
      - ".editorconfig"
      - "SemiPlot/**"
      - "SemiPlot.slnx"
      - "global.json"
      - "sql/**"
      - "!**.md"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".editorconfig"
      - "SemiPlot/**"
      - "SemiPlot.slnx"
      - "global.json"
      - "sql/**"
      - "!**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: restore
        run: dotnet restore SemiPlot.slnx

      - name: build
        run: dotnet build SemiPlot.slnx -c Release --no-restore

      - name: test
        run: dotnet test SemiPlot/SemiPlot.Tests/SemiPlot.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

  # Proves the UI suite runs on Linux. This job starts no container; the leg exists because
  # ubuntu-latest is the only runner able to host one alongside the suite later on.
  ui-tests-linux:
    name: UI Tests (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: restore
        run: dotnet restore SemiPlot/SemiPlot.Tests/SemiPlot.Tests.csproj

      - name: build
        run: dotnet build SemiPlot/SemiPlot.Tests/SemiPlot.Tests.csproj -c Release --no-restore

      # Relies on the runner image providing libfontconfig.so.1, which libSkiaSharp.so links against.
      # When it is absent, `ldd libSkiaSharp.so` reports `libfontconfig.so.1 => not found` and every
      # test that constructs TrendChartViewModel fails at once, not only the one that rasterises.
      # The remedy is `sudo apt-get install -y libfontconfig1` ahead of this step.
      - name: test
        run: dotnet test SemiPlot/SemiPlot.Tests/SemiPlot.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

  data-tests:
    name: Data Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      # On a pipeline an unavailable container runtime is a failure, never a silent skip. The two
      # jobs that omit this omit it deliberately: build-and-test runs on a Windows runner, which
      # cannot host a Linux container, and SemiPlot.Tests has no gated test to require one.
      SEMIPLOT_REQUIRE_DB: "1"

    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The pin is a tagged release, not a moving latest, so a change in SemiBase cannot fail this
      # suite without a version to blame. The published binary means no Go toolchain on the runner.
      - name: install semibase
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.1.0 --repo Semiteq/SemiBase \
            --pattern semibase_0.1.0_linux_amd64 --dir "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/semibase_0.1.0_linux_amd64"
          echo "SEMIBASE_EXE=$RUNNER_TEMP/semibase_0.1.0_linux_amd64" >> "$GITHUB_ENV"

      - name: restore
        run: dotnet restore SemiPlot/SemiPlot.Tests.Data/SemiPlot.Tests.Data.csproj

      - name: build
        run: dotnet build SemiPlot/SemiPlot.Tests.Data/SemiPlot.Tests.Data.csproj -c Release --no-restore

      - name: test
        run: dotnet test SemiPlot/SemiPlot.Tests.Data/SemiPlot.Tests.Data.csproj -c Release --no-build --logger "console;verbosity=normal"
